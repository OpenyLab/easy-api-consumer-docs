<html>

<head>
    <title>easy-api-consumer Guide</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="author" content="yLorde" />
    <meta name="description"
        content="Guia oficial do easy-api-consumer — cliente HTTP TypeScript com autenticação, utilitários de dispositivo e uma camada de API reutilizável." />


    <script>
        // Captura o caminho original antes de cair no 404
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        var redirect = path + search + hash;

        // Salva o caminho original no sessionStorage
        sessionStorage.setItem("redirect", redirect);

        // Redireciona para o index.html
        window.location.replace("/");
    </script>
</head>

</html>
